services:
  - type: web
    name: gaokao-planner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: RECORDS_FILE
        value: /data/records.json
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: 管理员
      - key: SALES_USERS
        sync: false
    disk:
      name: records
      mountPath: /data
      sizeGB: 1
